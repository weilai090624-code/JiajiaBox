    focusNode(id){const node=routeNodes.find(value=>value.id===id);if(!node)return;selectedNode=id;selected=-1;targetYaw=nearestYaw(-node.lon*Math.PI/180);targetPitch=node.lat*Math.PI/180;velocityYaw=velocityPitch=0;holdUntil=performance.now()+3000;request();},
    reset,
    inspect(){return {draws,yaw,pitch,zoom,paused,lost,failed,countries:countries.map(value=>({...value})),selected,autoRotate,velocityYaw,velocityPitch,targetYaw,targetPitch,targetZoom,surfaceBuilds,ready,nodes:routeNodes.map(value=>({...value})),links:routeLinks.map(value=>({...value})),curves:curves.length,selectedNode,sun:sunlight?{...sunlight,vector:sunlight.vector.slice()}:null,
      landings:curves.map(curve=>({from:curve.from,to:curve.to,start:curve.points[0].slice(),end:curve.points[curve.points.length-1].slice(),liftStart:Math.hypot(...curve.points[1]),liftEnd:Math.hypot(...curve.points[curve.points.length-2]),samples:curve.points.length}))};}
  };
  canvas.addEventListener('pointerdown',event=>{if(paused)return;event.preventDefault();canvas.setPointerCapture(event.pointerId);pointers.set(event.pointerId,[event.clientX,event.clientY]);previousPinch=0;travel=0;velocityYaw=velocityPitch=0;lastMove=performance.now();holdUntil=lastMove+2200;});
  canvas.addEventListener('pointermove',event=>{
    if(paused||!pointers.has(event.pointerId))return;event.preventDefault();const old=pointers.get(event.pointerId),dx=event.clientX-old[0],dy=event.clientY-old[1];
    pointers.set(event.pointerId,[event.clientX,event.clientY]);travel+=Math.abs(dx)+Math.abs(dy);
    const now=performance.now(),elapsed=Math.max(.008,Math.min(.08,(now-lastMove)/1000));lastMove=now;holdUntil=now+2200;
    if(pointers.size===1){targetYaw+=dx*.009;targetPitch=clampPitch(targetPitch+dy*.009);
      velocityYaw=.35*velocityYaw+.65*Math.max(-2,Math.min(2,dx*.009/elapsed));velocityPitch=.35*velocityPitch+.65*Math.max(-1.5,Math.min(1.5,dy*.009/elapsed));}
    else {const a=Array.from(pointers.values()),distance=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);
      velocityYaw=velocityPitch=0;if(previousPinch>0)targetZoom=Math.max(.72,Math.min(1.45,targetZoom*distance/previousPinch));previousPinch=distance;}
    request();
  });
  function up(event){const held=pointers.delete(event.pointerId);previousPinch=0;
    if(held){const now=performance.now();holdUntil=now+2200;if(event.type!=='pointerup'||now-lastMove>100)velocityYaw=velocityPitch=0;
      if(event.type==='pointerup'&&travel<5){if(lastTap>0&&now-lastTap<280)reset();lastTap=now;}request();}}
  for(const name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,up);
  canvas.addEventListener('wheel',event=>{event.preventDefault();if(!paused){targetZoom=Math.max(.72,Math.min(1.45,targetZoom*Math.exp(-event.deltaY*.001)));holdUntil=performance.now()+1800;request();}},{passive:false});
  canvas.addEventListener('webglcontextlost',event=>{event.preventDefault();lost=true;stop();});
  canvas.addEventListener('webglcontextrestored',()=>{try{init();lost=false;request();}catch(_){fail('3D 渲染恢复失败，请重新进入扩展页');}});
  if(window.ResizeObserver)new ResizeObserver(request).observe(canvas);else window.addEventListener('resize',request);
  document.addEventListener('visibilitychange',()=>{if(document.hidden){paused=true;stop();}});
  window.addEventListener('pagehide',stop);
  if(!gl){fail('当前 WebView 不支持 3D 加速');return;}
  try{init();}catch(_){fail('无法初始化 3D 地球');}
})();
</script></body></html>
